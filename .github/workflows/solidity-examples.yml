name: solidity-examples

# Compiles the Solidity examples embedded in skills/zama-solidity against the latest published
# @fhevm/solidity and OpenZeppelin confidential contracts, the versions an agent installs by
# default. The weekly run catches a package release that breaks an example nobody edited.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'skills/zama-solidity/**'
      - 'scripts/check_solidity_examples.py'
      - 'tests/solidity-examples/**'
      - '.github/workflows/solidity-examples.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: solidity-examples-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-examples:
    name: skill Solidity examples compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          version: "0.6.14"
          enable-cache: false

      - name: Install latest packages
        working-directory: tests/solidity-examples
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Compile examples
        run: uv run scripts/check_solidity_examples.py
